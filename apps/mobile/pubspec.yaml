name: nolleoon_mobile
description: 여행방과 네 가지 게임을 연결하는 놀러온 Flutter 앱.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <3.15.0'
  flutter: '>=3.50.0 <3.51.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.8
  flutter_secure_storage: 11.2.0
  kakao_flutter_sdk_user: 2.1.0
  app_links: 7.2.2
  image_picker: 1.2.4
  image_picker_android: 0.8.13+25
  image_picker_platform_interface: 2.11.2
  material_ui: 1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
